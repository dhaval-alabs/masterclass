name: WhatsApp queue drain (manual fallback)

# This used to be the PRIMARY driver of the WhatsApp queue, pinging the drain
# endpoint every ~5 minutes because the Vercel project lived under a team on
# the Hobby plan — which silently throttles/never-registers vercel.json's
# crons (confirmed via Settings -> Cron Jobs showing nothing, despite the
# project owner's own personal account being on Pro the whole time; Vercel
# billing/limits are scoped to the TEAM that owns the project, not the user).
#
# That team was upgraded to Pro on 2026-10-05 and Cron Jobs now lists all
# three jobs from vercel.json (process-whatsapp-queue, process-email-queue,
# score-unscored) at their real */5 and */10 schedules. Vercel's own cron is
# the primary mechanism again. The `schedule:` trigger below is intentionally
# removed rather than the whole file deleted: if Vercel's cron ever needs a
# manual nudge, this stays as a one-click fallback from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WhatsApp queue drain
        run: |
          curl -fsS -X POST \
            "https://masterclass.analytixlabs.co.in/api/cron/process-whatsapp-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w '\nHTTP %{http_code}\n' \
          || echo "drain request failed"
